# The lesson map for the whole book, in reading order.
# tools/build_nav.py reads this file and updates the nav in mkdocs.yml,
# docs/progress.md, and the lesson list in each folder's index.md.
#
# File paths come from the order here:
#   flat folder:     docs/<folder>/<NN>-<slug>.md
#   chaptered folder: docs/<folder>/<NN>-<chapter>/<NN>-<slug>.md
# A lesson entry is [slug, title] or [slug, title, flags] where flags can
# contain "optional" and/or "fast" (on the folder's fast path).

folders:
  - folder: 01-elementary
    title: Elementary
    tab: Elementary
    summary: Whole numbers, the four operations, fractions, decimals, measurement and basic geometry. Grades 1 to 5, written compactly for an adult who knows most of it.
    before: Nothing. This is the start.
    lessons:
      - [place-value-and-rounding, Place value and rounding]
      - [addition-and-subtraction, Addition and subtraction]
      - [multiplication-and-times-tables, Multiplication and times tables]
      - [properties-of-operations, Properties of operations]
      - [multi-digit-multiplication, Multi-digit multiplication]
      - [division-facts-and-remainders, Division facts and remainders]
      - [long-division, Long division]
      - [factors-multiples-and-primes, Factors, multiples and primes]
      - [fractions-and-equivalent-fractions, Fractions and equivalent fractions]
      - [adding-and-subtracting-fractions, Adding and subtracting fractions]
      - [multiplying-and-dividing-fractions, Multiplying and dividing fractions]
      - [decimals-place-value-and-adding, "Decimals: place value, adding and subtracting"]
      - [multiplying-and-dividing-decimals, Multiplying and dividing decimals]
      - [powers-of-ten, Powers of ten]
      - [measurement-and-unit-conversion, Measurement and unit conversion]
      - [geometry-basics-area-perimeter-volume, "Geometry basics: area, perimeter and volume"]

